name: Baseline validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: Glowrare/engineering-workflows/.github/workflows/node-ci.yml@ea8d615212d6efe7c25b558605a5cfbcb3e1e0db
    with:
      project-profile: service
      npm-version: '11.19.1'
      ignore-install-scripts: true

  summary:
    name: Validate summary
    needs: validate
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Report validation metadata
        shell: bash
        env:
          NODE_VERSION: ${{ needs.validate.outputs.resolved-node-version }}
          NPM_VERSION: ${{ needs.validate.outputs.resolved-npm-version }}
          PROFILE: ${{ needs.validate.outputs.validation-profile }}
        run: |
          {
            echo: "## CI Validation"
            echo ""
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Profile | $PROFILE |"
            echo "| Node.js | $NODE_VERSION |"
            echo "| npm | $NPM_VERSION |"
            echo "| Result | Passed |"
          } >> "$GITHUB_STEP_SUMMARY"
